[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bistatic-lb"
version = "0.1.0"
description = "Link-budget, detection, estimation and tracking analysis for one Tx-Rx bi-static radar pair"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "streamlit>=1.49",
    "itur>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "nbconvert", "nbformat", "ipykernel"]

[tool.setuptools.packages.find]
include = ["bistatic_lb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
